<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声域音频小店（作品演示）</title>
<style>:root{--c:#2d6cdf;--a:#2d6cdf;--bg:#f7f8fa;--t:#15171c}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--t);background:var(--bg);line-height:1.7}
.demo{background:#111;color:#fff;text-align:center;font-size:13px;padding:6px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 6vw;position:sticky;top:0;background:var(--bg);z-index:9;box-shadow:0 1px 0 #0001}
.logo{font-weight:800;font-size:20px;color:var(--c)}nav ul{display:flex;gap:24px;list-style:none}nav a{color:var(--t);text-decoration:none}
.mb{display:none;background:none;border:0;font-size:24px;color:var(--t)}
.hero{padding:80px 6vw;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.2;color:var(--c)}.hero p{margin:16px 0 26px;font-size:18px;opacity:.85}
.art{aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:110px}
.btn{display:inline-block;background:var(--c);color:#fff;padding:13px 26px;border-radius:999px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:16px}
section{padding:70px 6vw}h2{font-size:30px;color:var(--c);text-align:center;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{background:#fff;border-radius:16px;padding:26px;box-shadow:0 6px 24px #0000000f}.card .e{font-size:40px}.card h3{margin:8px 0 4px}
.stats{display:flex;justify-content:center;gap:50px;flex-wrap:wrap;text-align:center}.stats b{display:block;font-size:36px;color:var(--a)}
form{max-width:520px;margin:auto;display:grid;gap:12px}input,select,textarea{padding:13px;border-radius:10px;border:1px solid #ccc;font-size:16px;font-family:inherit}
.ok{text-align:center;color:green;display:none}footer{text-align:center;padding:28px;background:#111;color:#bbb;font-size:14px}
@media(max-width:760px){nav ul{display:none;position:absolute;top:60px;left:0;right:0;flex-direction:column;background:var(--bg);padding:20px 6vw}nav ul.open{display:flex}.mb{display:block}.hero{grid-template-columns:1fr;padding:50px 6vw}.art{max-width:240px;margin:auto;font-size:80px}}#drawer{position:fixed;top:0;right:0;height:100%;width:min(360px,90vw);background:#fff;padding:24px;transform:translateX(100%);transition:.3s;z-index:20;box-shadow:-10px 0 30px #0002;overflow:auto}#drawer.open{transform:none}#mask{position:fixed;inset:0;background:#0005;display:none;z-index:19}#mask.open{display:block}#close{position:absolute;top:16px;right:16px;border:0;background:none;font-size:20px}.it{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.it button{border:0;background:#eee;border-radius:6px;padding:0 8px}.card .add{margin-top:10px;padding:8px 18px;font-size:14px}</style></head><body><div class="demo">⚠️ 作品演示 · 虚构商家，非真实品牌，表单不会发送任何数据</div>

<nav><div class="logo">🎧 声域音频</div><button class="mb">☰</button><ul><li><a href="#goods">商品</a></li><li><a href="../product-3d/">3D 看货</a></li><li><a href="#" id="cartBtn">🛒 购物车 (<span id="cc">0</span>)</a></li></ul></nav>
<header class="hero"><div><h1>声域 X1<br>沉浸降噪头戴耳机</h1><p>40 小时续航 · 主动降噪 · 5 种配色。可在 3D 页面旋转、换色、拆解查看结构。</p><a class="btn" href="#goods">立即选购</a> <a class="btn" style="background:#15171c" href="../product-3d/">🔄 3D 看货</a></div><div class="art" style="background:linear-gradient(135deg,#2d6cdf,#15171c)">🎧</div></header>
<section style="background:#fff"><div class="stats"><div><b data-n="8000">0</b>位用户</div><div><b data-n="4.8">0</b>商品评分</div><div><b data-n="40">0</b>小时续航</div></div></section>
<section id="goods"><h2>全部商品</h2><div class="grid" id="grid"></div></section>
<aside id="drawer"><h3>购物车</h3><div id="items"></div><p id="tot"></p><button class="btn" id="pay">结算（演示）</button><p class="ok" id="paid">✅ 演示结算完成，未产生任何订单</p><button id="close">✕</button></aside><div id="mask"></div><footer>© 2026 声域音频小店（虚构）· 建站作品演示</footer><script>document.querySelector('.mb').onclick=()=>document.querySelector('nav ul').classList.toggle('open');
document.querySelectorAll('form[data-demo]').forEach(f=>f.onsubmit=e=>{e.preventDefault();f.reset();f.querySelector('.ok').style.display='block'});
const count=n=>{const t=+n.dataset.n,d=t%1?1:0;let i=0;const s=setInterval(()=>{i++;n.textContent=(t*i/40).toFixed(d);if(i>=40)clearInterval(s)},25)};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){count(e.target);io.unobserve(e.target)}}));document.querySelectorAll('[data-n]').forEach(n=>io.observe(n));
const P=[["声域 X1 头戴耳机","🎧",399],["声域 Buds 真无线","🎵",199],["便携蓝牙音箱","🔊",159],["耳机收纳包","👜",39],["编织充电线","🔌",19],["替换耳罩","⭕",29]],cart={};
grid.innerHTML=P.map((p,i)=>`<div class="card"><div class="e">${p[1]}</div><h3>${p[0]}</h3><b>S$${p[2]}</b><br><button class="btn add" data-i="${i}">加入购物车</button></div>`).join("");
const render=()=>{let n=0,s=0;items.innerHTML=Object.entries(cart).map(([i,q])=>{n+=q;s+=q*P[i][2];return`<div class="it">${P[i][0]} ×${q}<span><button data-d="${i}">−</button> S$${q*P[i][2]}</span></div>`}).join("")||"<p>购物车是空的</p>";cc.textContent=n;tot.textContent="合计 S$"+s};
const open=o=>{drawer.classList.toggle("open",o);mask.classList.toggle("open",o)};
grid.onclick=e=>{const i=e.target.dataset.i;if(i){cart[i]=(cart[i]||0)+1;render();open(true)}};
items.onclick=e=>{const i=e.target.dataset.d;if(i){if(!--cart[i])delete cart[i];render()}};
cartBtn.onclick=e=>{e.preventDefault();open(true)};close.onclick=mask.onclick=()=>open(false);
pay.onclick=()=>{for(const k in cart)delete cart[k];render();paid.style.display="block"};render();</script></body></html>
